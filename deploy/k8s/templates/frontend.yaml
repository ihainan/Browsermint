apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels: {{- include "browsermint.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.frontend }}
  selector:
    matchLabels:
      {{- include "browsermint.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "browsermint.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- include "browsermint.imagePullSecrets" . | nindent 6 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "browsermint.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: frontend
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            # Frontend nginx proxies /api,/ws,/novnc,/health here, making it a
            # self-contained origin (needed for bare NodePort access).
            - name: BACKEND_UPSTREAM
              value: "{{ .Release.Name }}-backend:24710"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
          resources: {{- toYaml .Values.resources.frontend | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels: {{- include "browsermint.labels" . | nindent 4 }}
spec:
  {{- if .Values.frontendNodePort }}
  # Direct http://<node-ip>:<nodePort> access (full site: the frontend nginx
  # proxies API/WS to the backend). Ingress access keeps working alongside.
  type: NodePort
  {{- end }}
  selector:
    {{- include "browsermint.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - port: 80
      targetPort: 80
      {{- if .Values.frontendNodePort }}
      nodePort: {{ .Values.frontendNodePort }}
      {{- end }}
